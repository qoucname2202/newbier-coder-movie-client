<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Dark Cinematic Background Gradient -->
    <radialGradient id="backdropBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#181e2b"/>
      <stop offset="55%" stop-color="#0d1017"/>
      <stop offset="100%" stop-color="#06070a"/>
    </radialGradient>

    <!-- Ambient Center Flare -->
    <radialGradient id="backdropGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#e50914" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e50914" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Frame Gradient -->
    <linearGradient id="frameGradWide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#475569" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Red Slash Gradient -->
    <linearGradient id="slashGradWide" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>

    <!-- Depth Shadow -->
    <filter id="softGlowWide" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="30" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="720" fill="url(#backdropBg)"/>
  <rect width="1280" height="720" fill="url(#backdropGlow)"/>

  <!-- Cinema 35mm Film Sprockets (Running along Top and Bottom edges) -->
  <g fill="#ffffff" opacity="0.05">
    <!-- Top Row Sprockets -->
    <rect x="40" y="22" width="28" height="18" rx="4"/>
    <rect x="100" y="22" width="28" height="18" rx="4"/>
    <rect x="160" y="22" width="28" height="18" rx="4"/>
    <rect x="220" y="22" width="28" height="18" rx="4"/>
    <rect x="280" y="22" width="28" height="18" rx="4"/>
    <rect x="340" y="22" width="28" height="18" rx="4"/>
    <rect x="400" y="22" width="28" height="18" rx="4"/>
    <rect x="460" y="22" width="28" height="18" rx="4"/>
    <rect x="520" y="22" width="28" height="18" rx="4"/>
    <rect x="580" y="22" width="28" height="18" rx="4"/>
    <rect x="640" y="22" width="28" height="18" rx="4"/>
    <rect x="700" y="22" width="28" height="18" rx="4"/>
    <rect x="760" y="22" width="28" height="18" rx="4"/>
    <rect x="820" y="22" width="28" height="18" rx="4"/>
    <rect x="880" y="22" width="28" height="18" rx="4"/>
    <rect x="940" y="22" width="28" height="18" rx="4"/>
    <rect x="1000" y="22" width="28" height="18" rx="4"/>
    <rect x="1060" y="22" width="28" height="18" rx="4"/>
    <rect x="1120" y="22" width="28" height="18" rx="4"/>
    <rect x="1180" y="22" width="28" height="18" rx="4"/>
    <rect x="1240" y="22" width="28" height="18" rx="4"/>

    <!-- Bottom Row Sprockets -->
    <rect x="40" y="680" width="28" height="18" rx="4"/>
    <rect x="100" y="680" width="28" height="18" rx="4"/>
    <rect x="160" y="680" width="28" height="18" rx="4"/>
    <rect x="220" y="680" width="28" height="18" rx="4"/>
    <rect x="280" y="680" width="28" height="18" rx="4"/>
    <rect x="340" y="680" width="28" height="18" rx="4"/>
    <rect x="400" y="680" width="28" height="18" rx="4"/>
    <rect x="460" y="680" width="28" height="18" rx="4"/>
    <rect x="520" y="680" width="28" height="18" rx="4"/>
    <rect x="580" y="680" width="28" height="18" rx="4"/>
    <rect x="640" y="680" width="28" height="18" rx="4"/>
    <rect x="700" y="680" width="28" height="18" rx="4"/>
    <rect x="760" y="680" width="28" height="18" rx="4"/>
    <rect x="820" y="680" width="28" height="18" rx="4"/>
    <rect x="880" y="680" width="28" height="18" rx="4"/>
    <rect x="940" y="680" width="28" height="18" rx="4"/>
    <rect x="1000" y="680" width="28" height="18" rx="4"/>
    <rect x="1060" y="680" width="28" height="18" rx="4"/>
    <rect x="1120" y="680" width="28" height="18" rx="4"/>
    <rect x="1180" y="680" width="28" height="18" rx="4"/>
    <rect x="1240" y="680" width="28" height="18" rx="4"/>
  </g>

  <!-- Film Frame Boundary Horizontal Guidelines -->
  <line x1="20" y1="56" x2="1260" y2="56" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="20" y1="664" x2="1260" y2="664" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- HEROIC PROMINENT BROKEN IMAGE EMBLEM -->
  <g filter="url(#softGlowWide)" transform="translate(440, 220)">
    <!-- Photo Frame (W: 400, H: 280, R: 32) -->
    <rect
      x="0"
      y="0"
      width="400"
      height="280"
      rx="32"
      fill="#0f1420"
      fill-opacity="0.75"
      stroke="url(#frameGradWide)"
      stroke-width="3.5"
    />

    <!-- Sun / Moon in Landscape -->
    <circle cx="105" cy="85" r="26" fill="#ffffff" fill-opacity="0.18"/>

    <!-- Mountain Ridges / Landscape Silhouette -->
    <!-- Back Mountain -->
    <path
      d="M 180 278 L 270 170 L 360 278 Z"
      fill="#ffffff"
      fill-opacity="0.07"
    />
    <!-- Front Mountain -->
    <path
      d="M 25 278 L 140 150 L 250 278 Z"
      fill="#ffffff"
      fill-opacity="0.13"
    />

    <!-- Dark Clearance Slit for the Diagonal Slash -->
    <line
      x1="-25"
      y1="305"
      x2="425"
      y2="-25"
      stroke="#0b0e14"
      stroke-width="18"
      stroke-linecap="round"
    />

    <!-- Iconic OS Diagonal Missing Media Slash -->
    <line
      x1="-25"
      y1="305"
      x2="425"
      y2="-25"
      stroke="url(#slashGradWide)"
      stroke-width="5"
      stroke-linecap="round"
    />
  </g>
</svg>
