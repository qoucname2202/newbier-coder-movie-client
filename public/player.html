<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Cinema Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    #artplayer-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background: #000000;
    }

    /* ========================================================
       1. CĂN GIỮA TUYỆT ĐỐI CHẤM DOT ĐỎ TRÊN THANH TIẾN ĐỘ PHIM
       ======================================================== */
    .art-video-player .art-bottom {
      padding: 0 16px 10px !important;
    }

    .art-video-player .art-progress {
      height: 16px !important;
      display: flex !important;
      align-items: center !important;
      cursor: pointer !important;
      margin-bottom: 4px !important;
    }

    .art-video-player .art-control-progress {
      height: 4px !important;
      border-radius: 2px !important;
      background: rgba(255, 255, 255, 0.22) !important;
      position: relative !important;
      width: 100% !important;
      transition: height 0.15s ease !important;
    }

    .art-video-player .art-progress:hover .art-control-progress {
      height: 6px !important;
      border-radius: 3px !important;
    }

    .art-video-player .art-control-progress-loaded {
      background: rgba(255, 255, 255, 0.38) !important;
      border-radius: 2px !important;
    }

    .art-video-player .art-control-progress-played {
      background: linear-gradient(90deg, #b80710 0%, #e50914 100%) !important;
      border-radius: 2px !important;
    }

    /* NÚT CHẤM DOT ĐỎ: CĂN GIỮA TRỤC HOÀN HẢO */
    .art-video-player .art-control-progress-indicator {
      width: 13px !important;
      height: 13px !important;
      border-radius: 50% !important;
      background-color: #e50914 !important;
      border: 2px solid #ffffff !important;
      box-shadow: 0 0 10px rgba(229, 9, 20, 0.95), 0 0 2px rgba(255, 255, 255, 0.8) !important;
      top: 50% !important;
      margin-top: 0 !important;
      transform: translate(-50%, -50%) !important;
      transition: width 0.15s ease, height 0.15s ease, box-shadow 0.15s ease !important;
      box-sizing: border-box !important;
      z-index: 10 !important;
      pointer-events: none !important;
    }

    .art-video-player .art-progress:hover .art-control-progress-indicator {
      width: 16px !important;
      height: 16px !important;
      box-shadow: 0 0 14px rgba(229, 9, 20, 1), 0 0 4px #ffffff !important;
    }

    /* ========================================================
       2. CĂN GIỮA HOÀN HẢO CÁC NÚT TĂNG GIẢM 10 GIÂY VỚI PLAY/VOL
       ======================================================== */
    .art-video-player .art-controls-left,
    .art-video-player .art-controls-right {
      display: flex !important;
      align-items: center !important;
      gap: 4px !important;
      height: 38px !important;
    }

    .art-video-player .art-control {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      height: 38px !important;
      padding: 0 4px !important;
      vertical-align: middle !important;
      line-height: 1 !important;
    }

    .art-control-seek-btn {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      height: 32px !important;
      width: 32px !important;
      border-radius: 6px !important;
      color: #cbd5e1 !important;
      background: transparent !important;
      border: none !important;
      cursor: pointer !important;
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1) !important;
      outline: none !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    .art-control-seek-btn:hover {
      color: #ffffff !important;
      background: rgba(255, 255, 255, 0.12) !important;
      transform: scale(1.08) !important;
    }

    .art-control-seek-btn:active {
      transform: scale(0.95) !important;
    }

    .art-control-seek-btn svg {
      display: block !important;
      margin: auto !important;
    }

    /* Loading Spinner */
    #loading-mask {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #000000;
      transition: opacity 0.3s ease;
    }

    #loading-mask.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.12);
      border-top-color: #e50914;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      color: #94a3b8;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
  </style>
  <!-- Load Hls.js and ArtPlayer from official fast CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/artplayer@5.1.7/dist/artplayer.js"></script>
</head>
<body>
  <div id="artplayer-container"></div>
  <div id="loading-mask">
    <div class="spinner"></div>
    <div class="loading-text">Đang tải luồng phát...</div>
  </div>

  <script>
    (function () {
      const urlParams = new URLSearchParams(window.location.search);
      let streamUrl = urlParams.get('url') || '';
      const movieTitle = urlParams.get('title') || 'Phim';
      const epName = urlParams.get('ep') || 'Tập 1';

      if (!streamUrl) {
        document.getElementById('loading-mask').innerHTML = '<div class="loading-text" style="color:#ef4444">Thiếu URL luồng phát</div>';
        return;
      }

      // If user passed a wrapped URL (e.g. from phimapi player/?url=...), unwrap it
      if (streamUrl.includes('url=')) {
        try {
          const innerParams = new URLSearchParams(streamUrl.split('?')[1]);
          if (innerParams.get('url')) {
            streamUrl = innerParams.get('url');
          }
        } catch (e) {}
      }

      let hlsInstance = null;

      const art = new Artplayer({
        container: '#artplayer-container',
        url: streamUrl,
        type: 'm3u8',
        customType: {
          m3u8: function (video, url, art) {
            if (Hls.isSupported()) {
              if (hlsInstance) hlsInstance.destroy();
              const hls = new Hls({
                maxBufferLength: 30,
                maxMaxBufferLength: 60,
                enableWorker: true
              });
              hls.loadSource(url);
              hls.attachMedia(video);
              hlsInstance = hls;
              art.hls = hls;

              hls.on(Hls.Events.MANIFEST_PARSED, function () {
                const mask = document.getElementById('loading-mask');
                if (mask) mask.classList.add('hidden');
              });

              hls.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) {
                  switch (data.type) {
                    case Hls.ErrorTypes.NETWORK_ERROR:
                      hls.startLoad();
                      break;
                    case Hls.ErrorTypes.MEDIA_ERROR:
                      hls.recoverMediaError();
                      break;
                    default:
                      hls.destroy();
                      break;
                  }
                }
              });

              art.on('destroy', function () {
                hls.destroy();
              });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
              video.src = url;
            } else {
              art.notice.show = 'Trình duyệt không hỗ trợ HLS';
            }
          }
        },
        theme: '#e50914',
        volume: 0.85,
        isLive: false,
        muted: false,
        autoplay: true,
        pip: true,
        autoSize: false,
        autoMini: false,
        screenshot: false,
        setting: true,
        loop: false,
        flip: false,
        playbackRate: true,
        aspectRatio: true,
        fullscreen: true,
        fullscreenWeb: true,
        miniProgressBar: true,
        mutex: true,
        backdrop: true,
        playsInline: true,
        autoPlayback: true,
        airplay: true,
        controls: [
          {
            position: 'left',
            index: 12,
            html: '<div class="art-control-seek-btn" title="Tua lùi 10 giây" aria-label="Tua lùi 10 giây"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12.5 4a8.5 8.5 0 1 0 7.89 5.34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polyline points="13 1 12.5 4.5 16 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="12" y="15.5" font-size="8" font-weight="700" fill="currentColor" text-anchor="middle" font-family="-apple-system, sans-serif">10</text></svg></div>',
            click: function () {
              art.seek = Math.max(0, art.currentTime - 10);
            },
          },
          {
            position: 'left',
            index: 14,
            html: '<div class="art-control-seek-btn" title="Tua tới 10 giây" aria-label="Tua tới 10 giây"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M11.5 4a8.5 8.5 0 1 1-7.89 5.34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polyline points="11 1 11.5 4.5 8 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="12" y="15.5" font-size="8" font-weight="700" fill="currentColor" text-anchor="middle" font-family="-apple-system, sans-serif">10</text></svg></div>',
            click: function () {
              art.seek = Math.min(art.duration, art.currentTime + 10);
            },
          }
        ]
      });

      art.on('ready', function () {
        const mask = document.getElementById('loading-mask');
        if (mask) mask.classList.add('hidden');
      });

      art.on('video:loadedmetadata', function () {
        const mask = document.getElementById('loading-mask');
        if (mask) mask.classList.add('hidden');
      });

      // Keyboard shortcuts
      window.addEventListener('keydown', function (e) {
        if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) {
          if (e.target.tagName !== 'INPUT') {
            e.preventDefault();
          }
        }
        if (e.code === 'Space') {
          art.toggle();
        } else if (e.code === 'ArrowLeft') {
          art.seek = Math.max(0, art.currentTime - 10);
        } else if (e.code === 'ArrowRight') {
          art.seek = Math.min(art.duration, art.currentTime + 10);
        } else if (e.code === 'ArrowUp') {
          art.volume = Math.min(1, art.volume + 0.1);
        } else if (e.code === 'ArrowDown') {
          art.volume = Math.max(0, art.volume - 0.1);
        }
      });
    })();
  </script>
</body>
</html>
